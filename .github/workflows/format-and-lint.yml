name: Format & Lint

on:
  push:
    branches:
      - chore/format-2026-08-04
  workflow_dispatch: {}

jobs:
  format-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Enable corepack and install
        run: |
          corepack enable
          yarn install --immutable || yarn install
      - name: Run formatter
        run: yarn run format
      - name: Run eslint autofix
        run: yarn run lint
      - name: Commit any changes
        uses: EndBug/add-and-commit@v9
        with:
          message: "chore: apply formatting and lint autofixes"
          add: '. '
